<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gästebuch – Skulptur + Raum</title>
    <meta name="description"
        content="Gästebuch von Skulptur + Raum – Gøran Thie, Bildhauerei und Kunst am Bau in Berlin.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.sculptur-raum.de/guestbook.html">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <script src="/js/i18n.js" type="module"></script>
    <script src="/js/theme.js" type="module"></script>
    <script src="/js/audio.js" type="module"></script>
    <script src="/js/guestbook-carousel.js" type="module"></script>
</head>

<body>
    <button type="button" id="audio-toggle" class="control-btn icon-btn audio-toggle" aria-pressed="false"
        aria-label="Musik abspielen">
        <svg data-icon="pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
        <svg data-icon="play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 4.5v15l12-7.5z"></path>
        </svg>
    </button>
    <audio id="site-audio" src="/audio/02%20Sun.m4a" loop preload="none"></audio>

    <div class="header-controls">
        <button type="button" id="lang-toggle" class="control-btn" aria-label="Switch language">EN</button>
        <button type="button" id="theme-toggle" class="control-btn icon-btn"
            aria-label="Helles Farbschema aktivieren">
            <svg data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path
                    d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41">
                </path>
            </svg>
            <svg data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <header class="guestbook-page-header">
        <a class="guestbook-page-logo" href="/index.html" aria-label="Zur Startseite">
            <img src="/assets/logos/S+R-Logo_1.png" width="1417" height="710" alt="Skulptur und Raum">
        </a>
        <div class="guestbook-page-header-right">
            <a class="guestbook-page-back" href="/index.html#guestbook" data-i18n="guestbookBack">&larr; Zvrück</a>
        </div>
    </header>

    <main class="guestbook-page-main">
        <h1 class="guestbook-page-title" data-i18n="guestbookPageTitle">Gästebvch</h1>
        <p class="guestbook-page-text" data-i18n="guestbookText">
            Ein Blick in unser Gästebuch – handgeschriebene Grüße und Eindrücke aus dem Atelier.
        </p>

        <div class="guestbook-carousel" id="guestbook-carousel">
            <div class="guestbook-carousel-viewport" id="guestbook-carousel-viewport">
                <div class="guestbook-carousel-track" id="guestbook-carousel-track"></div>
            </div>
            <button class="guestbook-carousel-nav guestbook-carousel-prev" type="button" aria-label="Vorheriger Eintrag">&#8249;</button>
            <button class="guestbook-carousel-nav guestbook-carousel-next" type="button" aria-label="Nächster Eintrag">&#8250;</button>
        </div>

        <p class="guestbook-carousel-count" role="status" aria-atomic="true">
            <span id="guestbook-carousel-index">1</span> / <span id="guestbook-carousel-total">1</span>
        </p>
    </main>

    <footer class="guestbook-page-footer">
        <p>Skulptur + Raum &middot; Gøran Thie</p>
        <p><a href="mailto:info@gipsmir.com">info@gipsmir.com</a></p>
    </footer>
</body>

</html>
